<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — JobTrackr AI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">⚡ JobTrackr AI</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="dashboard.html" class="active">Dashboard</a></li>
    <li><a href="analyzer.html">AI Analyzer</a></li>
    <li><a href="analytics.html">Analytics</a></li>
  </ul>
  <button class="btn btn-primary btn-sm" onclick="openModal()">+ Add Job</button>
</nav>

<div class="page">
  <div class="container">

    <!-- PAGE HEADER -->
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;">
      <div>
        <h1>My Applications</h1>
        <p>Track and manage all your job applications</p>
      </div>
      <button class="btn btn-primary" onclick="openModal()">+ Add New Job</button>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card blue">
        <div class="stat-icon">📨</div>
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total Applied</div>
      </div>
      <div class="stat-card yellow">
        <div class="stat-icon">🗣️</div>
        <div class="stat-value" id="stat-interview">0</div>
        <div class="stat-label">Interviews</div>
      </div>
      <div class="stat-card green">
        <div class="stat-icon">🎉</div>
        <div class="stat-value" id="stat-offer">0</div>
        <div class="stat-label">Offers</div>
      </div>
      <div class="stat-card red">
        <div class="stat-icon">❌</div>
        <div class="stat-value" id="stat-rejected">0</div>
        <div class="stat-label">Rejected</div>
      </div>
      <div class="stat-card purple">
        <div class="stat-icon">📈</div>
        <div class="stat-value" id="stat-rate">0%</div>
        <div class="stat-label">Success Rate</div>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="form-input" type="text" id="search-input" placeholder="Search company or role..." oninput="filterJobs()" />
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
        <button class="filter-tab" onclick="setFilter('Applied', this)">Applied</button>
        <button class="filter-tab" onclick="setFilter('Interview', this)">Interview</button>
        <button class="filter-tab" onclick="setFilter('Offer', this)">Offer</button>
        <button class="filter-tab" onclick="setFilter('Rejected', this)">Rejected</button>
      </div>
    </div>

    <!-- JOBS GRID -->
    <div class="jobs-grid" id="jobs-container">
      <div class="loading-overlay" style="grid-column:1/-1;">
        <div class="loading-spinner"></div>
        <span>Loading applications...</span>
      </div>
    </div>

  </div>
</div>

<!-- ADD/EDIT JOB MODAL -->
<div class="modal-overlay" id="job-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title">Add New Job</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <form id="job-form" onsubmit="submitJob(event)">
      <input type="hidden" id="job-id" />
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Company *</label>
          <input class="form-input" type="text" id="job-company" placeholder="e.g. Google" required />
        </div>
        <div class="form-group">
          <label class="form-label">Role *</label>
          <input class="form-input" type="text" id="job-role" placeholder="e.g. Software Engineer" required />
        </div>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-select" id="job-status">
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Location</label>
          <input class="form-input" type="text" id="job-location" placeholder="e.g. Remote / Bangalore" />
        </div>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Salary (optional)</label>
          <input class="form-input" type="text" id="job-salary" placeholder="e.g. ₹12 LPA" />
        </div>
        <div class="form-group">
          <label class="form-label">Job URL (optional)</label>
          <input class="form-input" type="url" id="job-url" placeholder="https://..." />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-textarea" id="job-notes" placeholder="Any notes about this application..." style="min-height:80px;"></textarea>
      </div>
      <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1rem;">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="submit-btn">Save Application</button>
      </div>
    </form>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toast-container"></div>

<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
